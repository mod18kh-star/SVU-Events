<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اتصل بنا</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">🎓 SVU Events</a>

    <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
        <li class="nav-item"><a class="nav-link" href="events.html">كل الفعاليات</a></li>
        <li class="nav-item"><a class="nav-link" href="event.html">تفاصيل فعالية</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">عن الدليل</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">اتصل بنا</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container my-5">
  <h2 class="section-title mb-4">اتصل بنا</h2>

  <div class="row g-4">
    <div class="col-md-7">
      <div class="card p-4">
        <div id="formAlert" style="display:none;"></div>

        <form onsubmit="return validateContact();">
          <div class="mb-3">
            <label class="form-label">الاسم</label>
            <input type="text" id="name" class="form-control" placeholder="اكتب اسمك">
          </div>

          <div class="mb-3">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="text" id="email" class="form-control" placeholder="example@email.com">
          </div>

          <div class="mb-3">
            <label class="form-label">الرسالة</label>
            <textarea id="message" rows="5" class="form-control" placeholder="اكتب رسالتك هنا"></textarea>
          </div>

          <button type="submit" class="btn btn-main">إرسال</button>
          <button type="reset" class="btn btn-secondary">مسح</button>
        </form>
      </div>
    </div>

    <div class="col-md-5">
      <div class="card p-4">
        <h4>معلومات التواصل</h4>
        <p><strong>البريد:</strong> events@svuonline.org</p>
        <p><strong>الموقع:</strong> الجامعة الافتراضية السورية</p>
        <p><strong>السوشيال:</strong> Facebook - Instagram - LinkedIn</p>
        <img src="https://images.unsplash.com/photo-1521791136064-7986c2920216?w=900" class="w-100 rounded">
      </div>
    </div>
  </div>
</main>

<footer class="text-center">
  <p>© 2026 دليل فعاليات الجامعة الافتراضية</p>
</footer>

<script src="assets/js/main.js"></script>
</body>
</html>
